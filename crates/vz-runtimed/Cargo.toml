[package]
name = "vz-runtimed"
version = "0.1.0"
description = "Runtime V2 control-plane daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-backend = []
e2e-test-hooks = ["vz-stack/e2e-test-hooks"]

[dependencies]
fs2 = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true, features = ["net", "sync"] }
tonic = { workspace = true }
prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { workspace = true }
shell-words = { workspace = true }
vz-runtime-contract = { workspace = true }
vz-runtime-proto = { workspace = true }
vz-runtime-translate = { workspace = true }
vz-stack = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
vz = { workspace = true }
tempfile = { workspace = true }
vz-oci-macos = { workspace = true }
vz-linux = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
vz-linux-native = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
vz-agent-proto = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
rusqlite = { version = "0.34", features = ["bundled"] }
tempfile = { workspace = true }

[lints]
workspace = true
