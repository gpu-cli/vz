// Runtime V2 gRPC service definitions for the vz control plane.
//
// Runtime V2 service groups include:
//   - TopologyService:   Developer Environment lookup and streamed Stop
//   - SandboxService:    sandbox lifecycle (create, get, list, terminate)
//   - LeaseService:      lease management (open, heartbeat, close)
//   - ContainerService:  container lifecycle (create, get, list, remove)
//   - ExecutionService:  exec lifecycle (create, stream, cancel, pty, signal)
//   - CheckpointService: checkpoint/restore/portability
//   - BuildService:      image builds (start, stream events, cancel)
//   - EventService:      event log (list, stream)
//   - FileService:       scoped sandbox filesystem primitives
//   - CapabilityService: runtime capabilities discovery
//
// Separate from agent.proto (which is guest-agent communication over vsock).

syntax = "proto3";

package vz.runtime.v2;

// ── Shared request metadata ────────────────────────────────────────

message RequestMetadata {
  // Correlated request identifier.
  string request_id = 1;
  // Idempotency key for retry-safe mutation calls.
  string idempotency_key = 2;
  // Distributed trace identifier.
  string trace_id = 3;
}

// ── Error envelope ─────────────────────────────────────────────────

// Serialized ErrorDetail protobuf bytes are carried in tonic Status details.
message ErrorDetail {
  string code = 1;
  string message = 2;
  string request_id = 3;
  // Stable machine-readable context retained across gRPC failures.
  map<string, string> details = 4;
}

// ── Developer Environment topology contract ──────────────────────
//
// These messages are the versioned wire representation of the portable
// Project -> Environment -> Machine aggregate. Lifecycle RPCs are added by a
// later slice; this section intentionally defines data and structured errors
// only. Existing Sandbox messages remain the low-level runtime primitive.

enum OperatingSystem {
  OPERATING_SYSTEM_UNSPECIFIED = 0;
  OPERATING_SYSTEM_LINUX = 1;
  OPERATING_SYSTEM_MACOS = 2;
  OPERATING_SYSTEM_WINDOWS = 3;
}

enum Architecture {
  ARCHITECTURE_UNSPECIFIED = 0;
  ARCHITECTURE_AARCH64 = 1;
  ARCHITECTURE_X86_64 = 2;
}

message HostSpec {
  OperatingSystem os = 1;
  Architecture arch = 2;
}

message TargetSpec {
  OperatingSystem os = 1;
  Architecture arch = 2;
  string image = 3;
  optional string version = 4;
  optional string channel = 5;
  optional string digest = 6;
}

enum MachineCapability {
  MACHINE_CAPABILITY_UNSPECIFIED = 0;
  MACHINE_CAPABILITY_POSIX_EXEC = 1;
  MACHINE_CAPABILITY_POSIX_PTY = 2;
  MACHINE_CAPABILITY_SIGNALS = 3;
  MACHINE_CAPABILITY_FILES = 4;
  MACHINE_CAPABILITY_PORTS = 5;
  MACHINE_CAPABILITY_DOCKER_ENGINE = 6;
  MACHINE_CAPABILITY_COMPOSE = 7;
  MACHINE_CAPABILITY_BUILDX = 8;
  MACHINE_CAPABILITY_SNAPSHOT = 9;
  MACHINE_CAPABILITY_SUSPEND = 10;
  MACHINE_CAPABILITY_CHECKPOINT = 11;
  MACHINE_CAPABILITY_GUI = 12;
  MACHINE_CAPABILITY_WINDOWS_CONSOLE = 13;
}

message UnsupportedMachineCapability {
  MachineCapability capability = 1;
  string reason = 2;
}

// Used for both requested and negotiated capability sets. Requested sets
// normally contain only capabilities. Negotiated sets may additionally retain
// a structured reason for every unsupported request.
message CapabilitySet {
  repeated MachineCapability capabilities = 1;
  repeated UnsupportedMachineCapability unsupported = 2;
}

message MachineResources {
  optional uint32 cpus = 1;
  optional uint64 memory_mb = 2;
  optional uint64 disk_bytes = 3;
}

enum WorkspaceProjectionMode {
  WORKSPACE_PROJECTION_MODE_UNSPECIFIED = 0;
  WORKSPACE_PROJECTION_MODE_READ_WRITE = 1;
  WORKSPACE_PROJECTION_MODE_READ_ONLY = 2;
  WORKSPACE_PROJECTION_MODE_SNAPSHOT = 3;
}

message WorkspaceProjection {
  string binding = 1;
  string target_path = 2;
  WorkspaceProjectionMode mode = 3;
}

enum MachineProfile {
  MACHINE_PROFILE_UNSPECIFIED = 0;
  MACHINE_PROFILE_DEVELOPER = 1;
  MACHINE_PROFILE_HARDENED = 2;
}

message MachineSpec {
  uint32 schema_version = 1;
  string name = 2;
  TargetSpec target = 3;
  MachineResources resources = 4;
  CapabilitySet requested_capabilities = 5;
  optional WorkspaceProjection workspace = 6;
  MachineProfile profile = 7;
}

enum NetworkKind {
  NETWORK_KIND_UNSPECIFIED = 0;
  NETWORK_KIND_PRIVATE = 1;
  NETWORK_KIND_SIMULATED_PUBLIC = 2;
}

message NetworkSpec {
  uint32 schema_version = 1;
  string name = 2;
  NetworkKind kind = 3;
  optional string cidr = 4;
}

enum EndpointProtocol {
  ENDPOINT_PROTOCOL_UNSPECIFIED = 0;
  ENDPOINT_PROTOCOL_TCP = 1;
  ENDPOINT_PROTOCOL_UDP = 2;
  ENDPOINT_PROTOCOL_HTTP = 3;
  ENDPOINT_PROTOCOL_HTTPS = 4;
}

message EndpointSpec {
  uint32 schema_version = 1;
  string name = 2;
  string machine = 3;
  string network = 4;
  EndpointProtocol protocol = 5;
  uint32 port = 6;
  optional string hostname = 7;
}

message EnvironmentSpec {
  uint32 schema_version = 1;
  repeated MachineSpec machines = 2;
  repeated NetworkSpec networks = 3;
  repeated EndpointSpec endpoints = 4;
  // Topology-local name; explicit and process Machine selectors take precedence.
  optional string default_machine = 5;
}

message ProjectDefinition {
  uint32 schema_version = 1;
  string project_id = 2;
  string name = 3;
  EnvironmentSpec environment = 4;
}

message WorkspaceBinding {
  uint32 schema_version = 1;
  string binding_id = 2;
  string project_id = 3;
  string environment_id = 4;
  string workspace_key = 5;
  optional string path_hint = 6;
  string name = 7;
}

enum EnvironmentState {
  ENVIRONMENT_STATE_UNSPECIFIED = 0;
  ENVIRONMENT_STATE_CREATING = 1;
  ENVIRONMENT_STATE_RECONCILING = 2;
  ENVIRONMENT_STATE_READY = 3;
  ENVIRONMENT_STATE_STOPPED = 4;
  ENVIRONMENT_STATE_DELETING = 5;
  ENVIRONMENT_STATE_DELETED = 6;
  ENVIRONMENT_STATE_FAILED = 7;
  ENVIRONMENT_STATE_DEGRADED = 8;
}

enum MachineState {
  MACHINE_STATE_UNSPECIFIED = 0;
  MACHINE_STATE_CREATING = 1;
  MACHINE_STATE_READY = 2;
  MACHINE_STATE_STOPPED = 3;
  MACHINE_STATE_FAILED = 4;
}

enum MachineBackend {
  MACHINE_BACKEND_UNSPECIFIED = 0;
  MACHINE_BACKEND_MACOS_VIRTUALIZATION_LINUX = 1;
  MACHINE_BACKEND_MACOS_NATIVE = 2;
  MACHINE_BACKEND_LINUX_NATIVE = 3;
  MACHINE_BACKEND_WINDOWS_LINUX = 4;
  MACHINE_BACKEND_WINDOWS_NATIVE = 5;
  MACHINE_BACKEND_OTHER = 6;
}

message MachineIncarnation {
  uint32 schema_version = 1;
  string incarnation_id = 2;
  string machine_id = 3;
  uint64 generation = 4;
  uint64 created_at = 5;
}

// Opaque, backend-issued comparison token for one exact Machine runtime.
// The value is target-neutral: Linux stack identity details are not part of
// the public topology contract for native macOS or Windows Machines.
message MachineRuntimeIdentity {
  uint32 schema_version = 1;
  string opaque_id = 2;
}

// Exact-owner host client selection; presence does not imply live readiness.
message MachineDockerContextDescriptor {
  uint32 schema_version = 1;
  string project_id = 2;
  string environment_id = 3;
  string machine_id = 4;
  string name = 5;
  string endpoint = 6;
  string config_dir = 7;
  string engine_id = 8;
  string incarnation_id = 9;
  uint64 incarnation_generation = 10;
}

// Backend result atomically published by a successful Machine Up step.
message MachineActivationEvidence {
  uint32 schema_version = 1;
  MachineBackend backend = 2;
  // Carries MachineBackend::Other(String) without weakening the enum contract.
  optional string other_backend = 3;
  CapabilitySet negotiated_capabilities = 4;
  MachineRuntimeIdentity runtime_identity = 5;
  MachineIncarnation incarnation = 6;
  optional MachineDockerContextDescriptor docker_context = 7;
}

message MachineInstance {
  uint32 schema_version = 1;
  string machine_id = 2;
  string environment_id = 3;
  string name = 4;
  TargetSpec target = 5;
  MachineResources resources = 6;
  CapabilitySet requested_capabilities = 7;
  CapabilitySet negotiated_capabilities = 8;
  optional MachineBackend backend = 9;
  // Carries MachineBackend::Other(String) without weakening the enum contract.
  optional string other_backend = 10;
  optional MachineIncarnation incarnation = 11;
  MachineState state = 12;
  optional string legacy_sandbox_id = 13;
  MachineProfile profile = 14;
  // Absent on historical instances persisted before exact runtime identity.
  optional MachineRuntimeIdentity runtime_identity = 15;
  optional MachineDockerContextDescriptor docker_context = 16;
}

message NetworkInstance {
  uint32 schema_version = 1;
  string network_id = 2;
  string environment_id = 3;
  string name = 4;
}

message EndpointInstance {
  uint32 schema_version = 1;
  string endpoint_id = 2;
  string environment_id = 3;
  string machine_id = 4;
  string network_id = 5;
  string name = 6;
}

enum OwnedResourceKind {
  OWNED_RESOURCE_KIND_UNSPECIFIED = 0;
  OWNED_RESOURCE_KIND_MACHINE = 1;
  OWNED_RESOURCE_KIND_INCARNATION = 2;
  OWNED_RESOURCE_KIND_DISK = 3;
  OWNED_RESOURCE_KIND_SOCKET = 4;
  OWNED_RESOURCE_KIND_DOCKER_CONTEXT = 5;
  OWNED_RESOURCE_KIND_NETWORK = 6;
  OWNED_RESOURCE_KIND_ENDPOINT = 7;
  OWNED_RESOURCE_KIND_CREDENTIAL = 8;
  OWNED_RESOURCE_KIND_FAULT = 9;
  OWNED_RESOURCE_KIND_LEGACY_SANDBOX = 10;
  OWNED_RESOURCE_KIND_OTHER = 11;
}

message OwnershipRecord {
  uint32 schema_version = 1;
  OwnedResourceKind resource_kind = 2;
  // Carries OwnedResourceKind::Other(String) without weakening the enum contract.
  optional string other_resource_kind = 3;
  string resource_id = 4;
  string environment_id = 5;
  optional string machine_id = 6;
}

enum EnvironmentLifecycleKind {
  ENVIRONMENT_LIFECYCLE_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_LIFECYCLE_KIND_UP = 1;
  ENVIRONMENT_LIFECYCLE_KIND_STOP = 2;
  ENVIRONMENT_LIFECYCLE_KIND_DELETE = 3;
}

enum EnvironmentLifecycleStatus {
  ENVIRONMENT_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  ENVIRONMENT_LIFECYCLE_STATUS_PLANNED = 1;
  ENVIRONMENT_LIFECYCLE_STATUS_RUNNING = 2;
  ENVIRONMENT_LIFECYCLE_STATUS_BLOCKED = 3;
  ENVIRONMENT_LIFECYCLE_STATUS_SUCCEEDED = 4;
  ENVIRONMENT_LIFECYCLE_STATUS_FAILED = 5;
  ENVIRONMENT_LIFECYCLE_STATUS_SUPERSEDED = 6;
}

enum LifecycleStepStatus {
  LIFECYCLE_STEP_STATUS_UNSPECIFIED = 0;
  LIFECYCLE_STEP_STATUS_PENDING = 1;
  LIFECYCLE_STEP_STATUS_RUNNING = 2;
  LIFECYCLE_STEP_STATUS_SUCCEEDED = 3;
  LIFECYCLE_STEP_STATUS_FAILED = 4;
}

message LifecycleStepSucceeded {
}

message LifecycleStepFailed {
  string reason = 1;
}

message LifecycleStepResult {
  oneof result {
    LifecycleStepSucceeded succeeded = 1;
    LifecycleStepFailed failed = 2;
  }
}

message MachineLifecycleStep {
  string machine_id = 1;
  MachineState initial_state = 2;
  optional MachineState target_state = 3;
  LifecycleStepStatus status = 4;
  optional string failure_reason = 5;
  optional MachineIncarnation expected_incarnation = 6;
  optional MachineIncarnation resulting_incarnation = 7;
  // Absent on historical terminal operations; required for new successful Up.
  optional MachineActivationEvidence resulting_activation = 8;
}

message MachineLifecycleStepAcknowledgement {
  string operation_id = 1;
  uint64 generation = 2;
  string machine_id = 3;
  MachineState initial_state = 4;
  optional MachineState target_state = 5;
  LifecycleStepResult result = 6;
  optional MachineIncarnation expected_incarnation = 7;
  optional MachineIncarnation resulting_incarnation = 8;
  optional MachineActivationEvidence resulting_activation = 9;
}

message OwnershipCleanupStep {
  OwnershipRecord ownership = 1;
  LifecycleStepStatus status = 2;
  optional string failure_reason = 3;
}

message OwnershipCleanupStepAcknowledgement {
  string operation_id = 1;
  uint64 generation = 2;
  OwnershipRecord ownership = 3;
  LifecycleStepResult result = 4;
}

message EnvironmentLifecycleOperation {
  uint32 schema_version = 1;
  string operation_id = 2;
  string project_id = 3;
  string environment_id = 4;
  EnvironmentLifecycleKind kind = 5;
  uint64 generation = 6;
  string request_id = 7;
  string idempotency_key = 8;
  string request_hash = 9;
  string definition_digest = 10;
  EnvironmentState initial_state = 11;
  EnvironmentState requested_target = 12;
  EnvironmentLifecycleStatus status = 13;
  repeated MachineLifecycleStep machine_steps = 14;
  repeated OwnershipCleanupStep cleanup_steps = 15;
  uint64 created_at = 16;
  uint64 updated_at = 17;
  optional uint64 completed_at = 18;
}

message EnvironmentTombstone {
  uint32 schema_version = 1;
  string project_id = 2;
  string environment_id = 3;
  string name = 4;
  string definition_digest = 5;
  string delete_operation_id = 6;
  uint64 lifecycle_generation = 7;
  string ownership_digest = 8;
  uint64 deleted_at = 9;
}

message LegacyMigrationProvenance {
  string source_version = 1;
  string legacy_sandbox_id = 2;
  repeated string unresolved_resources = 3;
}

message EnvironmentInstance {
  uint32 schema_version = 1;
  string environment_id = 2;
  string project_id = 3;
  string name = 4;
  string definition_digest = 5;
  EnvironmentState state = 6;
  repeated WorkspaceBinding bindings = 7;
  repeated MachineInstance machines = 8;
  repeated NetworkInstance networks = 9;
  repeated EndpointInstance endpoints = 10;
  repeated OwnershipRecord ownership = 11;
  optional LegacyMigrationProvenance legacy_migration = 12;
  uint64 created_at = 13;
  uint64 updated_at = 14;
  uint64 lifecycle_generation = 15;
  optional string active_operation_id = 16;
}

message ProjectState {
  uint32 schema_version = 1;
  ProjectDefinition definition = 2;
  repeated EnvironmentInstance environments = 3;
}

// Developer Environment queries and daemon-owned topology lifecycle.
service TopologyService {
  rpc GetProjectState(GetProjectStateRequest) returns (GetProjectStateResponse);
  // Bounded coalescing snapshots; disconnect ends observation, not boot effects.
  rpc UpEnvironment(UpEnvironmentRequest) returns (stream UpEnvironmentEvent);
  // Disconnect cancels observation, not the admitted Stop. Replay with the
  // same request/idempotency IDs resumes the durable operation or its receipt.
  rpc StopEnvironment(StopEnvironmentRequest) returns (stream StopEnvironmentEvent);
  // Delete traverses the exact Environment ownership graph. Disconnect ends
  // observation only; exact request replay survives deletion/name reuse.
  // Progress is bounded/coalescing: sequence strictly increases, gaps allowed.
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (stream DeleteEnvironmentEvent);
  // First frame opens one exact Machine execution. Subsequent frames control
  // only that execution; disconnect requests cancellation and terminal reap.
  rpc ExecMachine(stream MachineExecFrame) returns (stream MachineExecEvent);
}

message MachineExecutionTerminal {
  uint32 rows = 1;
  uint32 columns = 2;
}

message MachineExecutionSpec {
  repeated string argv = 1;
  map<string, string> environment = 2;
  optional string working_directory = 3;
  optional string user = 4;
  optional MachineExecutionTerminal terminal = 5;
  uint64 timeout_millis = 6;
}

message MachineExecOpen {
  string project_id = 1;
  optional string environment = 2;
  optional string process_environment_id = 3;
  optional string workspace_key = 4;
  optional string machine = 5;
  optional string process_machine_id = 6;
  MachineExecutionSpec spec = 7;
}

message MachineExecFrame {
  RequestMetadata metadata = 1;
  uint64 sequence = 2;
  // Empty only on the first Open frame; exact accepted ID on every control.
  string execution_id = 3;
  oneof payload {
    MachineExecOpen open = 4;
    bytes stdin = 5;
    bool stdin_eof = 6;
    int32 signal = 7;
    MachineExecutionTerminal resize = 8;
    bool cancel = 9;
  }
}

message MachineExecutionScope {
  uint32 schema_version = 1;
  string execution_id = 2;
  string request_id = 3;
  string idempotency_key = 4;
  string request_hash = 5;
  string project_id = 6;
  string environment_id = 7;
  string machine_id = 8;
  uint64 environment_generation = 9;
  MachineIncarnation incarnation = 10;
  MachineRuntimeIdentity runtime_identity = 11;
  string definition_digest = 12;
}

enum MachineExecutionState {
  MACHINE_EXECUTION_STATE_UNSPECIFIED = 0;
  MACHINE_EXECUTION_STATE_ADMITTED = 1;
  MACHINE_EXECUTION_STATE_COMPLETED = 2;
  MACHINE_EXECUTION_STATE_UNCERTAIN = 3;
  MACHINE_EXECUTION_STATE_QUIESCED = 4;
}

message MachineExecutionReceipt {
  MachineExecutionScope scope = 1;
  MachineExecutionState state = 2;
  optional int32 exit_code = 3;
  optional string failure = 4;
  bool output_replay_available = 5;
  uint64 created_at = 6;
  uint64 updated_at = 7;
}

message MachineExecEvent {
  uint32 schema_version = 1;
  MachineExecutionScope scope = 2;
  uint64 sequence = 3;
  // Only a stored terminal receipt may be replayed; output is not retained.
  bool replayed = 4;
  oneof payload {
    bool ready = 5;
    bytes stdout = 6;
    bytes stderr = 7;
    MachineExecutionReceipt receipt = 8;
  }
}

message UpEnvironmentRequest {
  RequestMetadata metadata = 1;
  ProjectDefinition definition = 2;
  optional string environment = 3;
  optional string process_environment_id = 4;
  optional string workspace_key = 5;
  optional string path_hint = 6;
  uint64 timeout_millis = 7;
}

message EnvironmentUpAdmission {
  uint32 schema_version = 1;
  string project_id = 2;
  string environment_id = 3;
  repeated string machine_ids = 4;
  string definition_digest = 5;
  string request_id = 6;
  string idempotency_key = 7;
  string request_hash = 8;
  optional string workspace_key = 9;
  uint64 created_at = 10;
}

message EnvironmentUpCompletion {
  EnvironmentUpAdmission admission = 1;
  optional EnvironmentLifecycleOperation operation = 2;
  optional WorkspaceBinding workspace_binding = 3;
  optional ErrorDetail error = 4;
  uint64 completed_at = 5;
}

message UpEnvironmentEvent {
  uint32 schema_version = 1;
  uint64 sequence = 2;
  EnvironmentUpAdmission admission = 3;
  string phase = 4;
  optional EnvironmentLifecycleOperation operation = 5;
  optional EnvironmentUpCompletion completion = 6;
}

message StopEnvironmentRequest {
  RequestMetadata metadata = 1;
  string project_id = 2;
  optional string environment = 3;
  optional string process_environment_id = 4;
  optional string workspace_key = 5;
  // Bounded physical Stop deadline per Machine, 1..300000 milliseconds.
  uint64 machine_timeout_millis = 6;
}

message StopEnvironmentEvent {
  uint32 schema_version = 1;
  string request_id = 2;
  uint64 sequence = 3;
  EnvironmentLifecycleOperation operation = 4;
  bool terminal = 5;
  // Present for a failed terminal operation, never a successful receipt.
  optional ErrorDetail error = 6;
}

message DeleteEnvironmentRequest {
  RequestMetadata metadata = 1;
  string project_id = 2;
  optional string environment = 3;
  optional string process_environment_id = 4;
  optional string workspace_key = 5;
  uint64 machine_timeout_millis = 6;
}

message DeleteEnvironmentEvent {
  uint32 schema_version = 1;
  string request_id = 2;
  uint64 sequence = 3;
  EnvironmentLifecycleOperation operation = 4;
  bool terminal = 5;
  optional ErrorDetail error = 6;
  // Required only for successful terminal Delete. Exact owner, generation,
  // operation, ownership digest and completion time must agree.
  optional EnvironmentTombstone tombstone = 7;
}

message GetProjectStateRequest {
  RequestMetadata metadata = 1;
  string project_id = 2;
}

message GetProjectStateResponse {
  string request_id = 1;
  ProjectState project = 2;
}

message TopologyCandidate {
  string id = 1;
  string name = 2;
}

message TopologyNotFoundDetail {
  string kind = 1;
  string selector = 2;
}

message TopologyAmbiguityDetail {
  string kind = 1;
  string selector = 2;
  repeated TopologyCandidate candidates = 3;
}

message TopologySelectionRequiredDetail {
  string kind = 1;
  string selector = 2;
  repeated TopologyCandidate candidates = 3;
}

message TopologyInvalidSelectorDetail {
  string kind = 1;
  string selector = 2;
  string reason = 3;
}

message TopologyUnsupportedTargetDetail {
  OperatingSystem host_os = 1;
  Architecture host_arch = 2;
  OperatingSystem target_os = 3;
  Architecture target_arch = 4;
  repeated MachineCapability requested_capabilities = 5;
}

message TopologyMissingCapabilityDetail {
  string machine_id = 1;
  MachineCapability capability = 2;
}

message TopologyInvalidMachineProfileDetail {
  string machine_id = 1;
  MachineProfile profile = 2;
  string reason = 3;
}

message TopologyInvalidCapabilityDeclarationDetail {
  string machine_id = 1;
  string reason = 2;
}

message TopologyContradictoryCapabilityDetail {
  string machine_id = 1;
  MachineCapability capability = 2;
}

message TopologyInvalidLifecycleStateDetail {
  string environment_id = 1;
  string reason = 2;
}

message TopologyInvalidMachineIncarnationDetail {
  string machine_id = 1;
  string reason = 2;
}

// Structured detail suitable for an ErrorDetail companion. Do not require
// clients to parse ambiguity or unsupported-target information from prose.
message TopologyErrorDetail {
  oneof detail {
    TopologyNotFoundDetail not_found = 1;
    TopologyAmbiguityDetail ambiguous = 2;
    TopologyUnsupportedTargetDetail unsupported_target = 3;
    TopologyMissingCapabilityDetail missing_capability = 4;
    TopologyInvalidMachineProfileDetail invalid_machine_profile = 5;
    TopologyInvalidCapabilityDeclarationDetail invalid_capability_declaration = 6;
    TopologyContradictoryCapabilityDetail contradictory_capability = 7;
    TopologySelectionRequiredDetail selection_required = 8;
    TopologyInvalidSelectorDetail invalid_selector = 9;
    TopologyInvalidLifecycleStateDetail invalid_lifecycle_state = 10;
    TopologyInvalidMachineIncarnationDetail invalid_machine_incarnation = 11;
  }
}

message TopologyLifecycleInvalidTransitionDetail {
  string environment_id = 1;
  EnvironmentLifecycleKind operation = 2;
  EnvironmentState state = 3;
}

message TopologyLifecycleOperationConflictDetail {
  string environment_id = 1;
  string active_operation_id = 2;
}

message TopologyLifecycleGenerationMismatchDetail {
  string operation_id = 1;
  uint64 expected = 2;
  uint64 found = 3;
}

message TopologyLifecycleOperationMismatchDetail {
  string environment_id = 1;
  string expected = 2;
  string found = 3;
}

message TopologyLifecycleMachineStepNotFoundDetail {
  string operation_id = 1;
  string machine_id = 2;
}

message TopologyLifecycleMachineStepMismatchDetail {
  string machine_id = 1;
}

message TopologyLifecycleOwnershipStepMismatchDetail {
  string operation_id = 1;
  string resource_kind = 2;
  string resource_id = 3;
}

message TopologyLifecycleOperationIncompleteDetail {
  string operation_id = 1;
}

message TopologyLifecycleOperationFailedDetail {
  string operation_id = 1;
}

message TopologyLifecycleDeleteRequiredDetail {
  string operation_id = 1;
}

message TopologyLifecycleDeletedEnvironmentIsNotLiveDetail {
  string environment_id = 1;
}

message TopologyLifecycleInvalidOperationDetail {
  string reason = 1;
}

message TopologyLifecycleErrorDetail {
  oneof detail {
    TopologyLifecycleInvalidTransitionDetail invalid_transition = 1;
    TopologyLifecycleOperationConflictDetail operation_conflict = 2;
    TopologyLifecycleGenerationMismatchDetail generation_mismatch = 3;
    TopologyLifecycleOperationMismatchDetail operation_mismatch = 4;
    TopologyLifecycleMachineStepNotFoundDetail machine_step_not_found = 5;
    TopologyLifecycleMachineStepMismatchDetail machine_step_mismatch = 6;
    TopologyLifecycleOwnershipStepMismatchDetail ownership_step_mismatch = 7;
    TopologyLifecycleOperationIncompleteDetail operation_incomplete = 8;
    TopologyLifecycleOperationFailedDetail operation_failed = 9;
    TopologyLifecycleDeleteRequiredDetail delete_required = 10;
    TopologyLifecycleDeletedEnvironmentIsNotLiveDetail deleted_environment_is_not_live = 11;
    TopologyLifecycleInvalidOperationDetail invalid_operation = 12;
  }
}

// ── 1. SandboxService ──────────────────────────────────────────────

service SandboxService {
  rpc CreateSandbox(CreateSandboxRequest) returns (stream CreateSandboxEvent);
  rpc PrepareSpaceCache(PrepareSpaceCacheRequest) returns (stream PrepareSpaceCacheEvent);
  rpc ExportSpaceCache(ExportSpaceCacheRequest) returns (stream ExportSpaceCacheEvent);
  rpc ImportSpaceCache(ImportSpaceCacheRequest) returns (stream ImportSpaceCacheEvent);
  rpc GetSandbox(GetSandboxRequest) returns (SandboxResponse);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc TerminateSandbox(TerminateSandboxRequest) returns (stream TerminateSandboxEvent);
  rpc OpenSandboxShell(OpenSandboxShellRequest) returns (stream OpenSandboxShellEvent);
  rpc CloseSandboxShell(CloseSandboxShellRequest) returns (stream CloseSandboxShellEvent);
}

message CreateSandboxRequest {
  RequestMetadata metadata = 1;
  string stack_name = 2;
  uint32 cpus = 3;
  uint64 memory_mb = 4;
  map<string, string> labels = 5;
  // Explicit VirtioFS volume mounts for the shared VM.
  // When present, these are used instead of deriving mounts from labels.
  repeated VolumeMount volume_mounts = 6;
  // Optional path to a persistent disk image (ext4) attached as VirtioBlock.
  string disk_image_path = 7;
  // Host-to-container port mappings for port forwarding.
  repeated PortMapping port_mappings = 8;
}

// Host-to-container port mapping for port forwarding.
message PortMapping {
  // Host port to listen on.
  uint32 host_port = 1;
  // Container port to forward to.
  uint32 container_port = 2;
  // Protocol: "tcp" or "udp".
  string protocol = 3;
}

// A host directory to expose inside the shared VM via VirtioFS.
message VolumeMount {
  // VirtioFS mount tag (e.g., "vz-mount-0").
  string tag = 1;
  // Absolute path on the host.
  string host_path = 2;
  // Target path inside the guest (e.g., "/workspace").
  // Communicated via kernel cmdline parameter vz.mount.{N}={guest_path}.
  string guest_path = 3;
  // Whether the mount is read-only.
  bool read_only = 4;
}

