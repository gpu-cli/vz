// Authoritative identity for a stack workload on one persisted Machine.
//
// Servers validate every identifier against persisted topology before using the
// scope to select or mutate a stack. An empty or missing
// machine_incarnation_id is invalid for authoritative mutation. The
// schema_version makes future scope evolution explicit; clients must not
// synthesize missing identity fields.
message MachineWorkloadScope {
  uint32 schema_version = 1;
  string project_id = 2;
  string environment_id = 3;
  string machine_id = 4;
  string machine_incarnation_id = 5;
  string stack_id = 6;
}

message ApplyStackRequest {
  RequestMetadata metadata = 1;
  string stack_name = 2;
  string compose_yaml = 3;
  string compose_dir = 4;
  bool dry_run = 5;
  bool detach = 6;
  MachineWorkloadScope scope = 7;
}

message StackServiceStatus {
  string service_name = 1;
  string phase = 2;
  bool ready = 3;
  string container_id = 4;
  string last_error = 5;
  uint32 replica_index = 6;
}

message ApplyStackResponse {
  string request_id = 1;
  string stack_name = 2;
  uint32 changed_actions = 3;
  bool converged = 4;
  uint32 services_ready = 5;
  uint32 services_failed = 6;
  repeated StackServiceStatus services = 7;
}

message StackMutationProgress {
  string phase = 1;
  string detail = 2;
}

message ApplyStackCompletion {
  ApplyStackResponse response = 1;
  string receipt_id = 2;
}

message ApplyStackEvent {
  string request_id = 1;
  uint64 sequence = 2;
  oneof payload {
    StackMutationProgress progress = 3;
    ApplyStackCompletion completion = 4;
  }
}

message TeardownStackRequest {
  RequestMetadata metadata = 1;
  string stack_name = 2;
  bool dry_run = 3;
  bool remove_volumes = 4;
  MachineWorkloadScope scope = 5;
}

message TeardownStackResponse {
  string request_id = 1;
  string stack_name = 2;
  uint32 changed_actions = 3;
  uint32 removed_volumes = 4;
}

message TeardownStackCompletion {
  TeardownStackResponse response = 1;
  string receipt_id = 2;
}

message TeardownStackEvent {
  string request_id = 1;
  uint64 sequence = 2;
  oneof payload {
    StackMutationProgress progress = 3;
    TeardownStackCompletion completion = 4;
  }
}

message GetStackStatusRequest {
  RequestMetadata metadata = 1;
  string stack_name = 2;
  MachineWorkloadScope scope = 3;
}

message GetStackStatusResponse {
  string request_id = 1;
  string stack_name = 2;
  repeated StackServiceStatus services = 3;
}

message ListStackEventsRequest {
  RequestMetadata metadata = 1;
  string stack_name = 2;
  int64 after = 3;
  uint32 limit = 4;
  MachineWorkloadScope scope = 5;
}

message ListStackEventsResponse {
  string request_id = 1;
  repeated RuntimeEvent events = 2;
  int64 next_cursor = 3;
}

message GetStackLogsRequest {
  RequestMetadata metadata = 1;
  string stack_name = 2;
  string service = 3;
  uint32 tail = 4;
  MachineWorkloadScope scope = 5;
}

message StackServiceLog {
  string service_name = 1;
  string output = 2;
}

message GetStackLogsResponse {
  string request_id = 1;
  string stack_name = 2;
  repeated StackServiceLog logs = 3;
}

message StackServiceActionRequest {
  RequestMetadata metadata = 1;
  string stack_name = 2;
  string service_name = 3;
  MachineWorkloadScope scope = 4;
}

message StackServiceActionResponse {
  string request_id = 1;
  string stack_name = 2;
  StackServiceStatus service = 3;
}

message StackServiceActionCompletion {
  StackServiceActionResponse response = 1;
  string receipt_id = 2;
}

message StackServiceActionEvent {
  string request_id = 1;
  uint64 sequence = 2;
  oneof payload {
    StackMutationProgress progress = 3;
    StackServiceActionCompletion completion = 4;
  }
}

message StackRunContainerRequest {
  RequestMetadata metadata = 1;
  string stack_name = 2;
  string service_name = 3;
  string run_service_name = 4;
  MachineWorkloadScope scope = 5;
}

message StackRunContainerResponse {
  string request_id = 1;
  string stack_name = 2;
  string service_name = 3;
  string run_service_name = 4;
  string container_id = 5;
}

// ── 9. FileService ────────────────────────────────────────────────

service FileService {
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc MakeDir(MakeDirRequest) returns (FileMutationResponse);
  rpc RemovePath(RemovePathRequest) returns (FileMutationResponse);
  rpc MovePath(MovePathRequest) returns (FileMutationResponse);
  rpc CopyPath(CopyPathRequest) returns (FileMutationResponse);
  rpc ChmodPath(ChmodPathRequest) returns (FileMutationResponse);
  rpc ChownPath(ChownPathRequest) returns (FileMutationResponse);
}

message FileEntry {
  string path = 1;
  bool is_dir = 2;
  uint64 size = 3;
  uint64 modified_at = 4;
}

message ReadFileRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string path = 3;
  uint64 offset = 4;
  uint64 limit = 5;
}

message ReadFileResponse {
  string request_id = 1;
  bytes data = 2;
  bool truncated = 3;
}

message WriteFileRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string path = 3;
  bytes data = 4;
  bool append = 5;
  bool create_parents = 6;
}

message WriteFileResponse {
  string request_id = 1;
  uint64 bytes_written = 2;
}

message ListFilesRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string path = 3;
  bool recursive = 4;
  uint32 limit = 5;
}

message ListFilesResponse {
  string request_id = 1;
  repeated FileEntry entries = 2;
}

message MakeDirRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string path = 3;
  bool parents = 4;
}

message RemovePathRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string path = 3;
  bool recursive = 4;
}

message MovePathRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string src_path = 3;
  string dst_path = 4;
  bool overwrite = 5;
}

message CopyPathRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string src_path = 3;
  string dst_path = 4;
  bool overwrite = 5;
}

message ChmodPathRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string path = 3;
  uint32 mode = 4;
}

message ChownPathRequest {
  RequestMetadata metadata = 1;
  string sandbox_id = 2;
  string path = 3;
  uint32 uid = 4;
  uint32 gid = 5;
}

message FileMutationResponse {
  string request_id = 1;
  string path = 2;
  string status = 3;
}

// ── 10. CapabilityService ─────────────────────────────────────────

service CapabilityService {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message GetCapabilitiesRequest {
  RequestMetadata metadata = 1;
}

message Capability {
  string name = 1;
  bool enabled = 2;
}

message GetCapabilitiesResponse {
  string request_id = 1;
  repeated Capability capabilities = 2;
}
